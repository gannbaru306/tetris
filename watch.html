<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リプレイを開いています…</title>
</head>
<body>
<p>リプレイを開いています…</p>
<noscript><p>JavaScriptを有効にしてください。</p></noscript>
<script>
// /watch?id=XXXX を、メインのページ（同じフォルダの index.html）の ?watch=XXXX にする
(function () {
  var id = new URLSearchParams(location.search).get('id') || '';
  location.replace('./?watch=' + encodeURIComponent(id));
})();
</script>
</body>
</html>
